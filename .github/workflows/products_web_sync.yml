name: Sincronizar Catálogo MeLi → NeonDB (Web)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Ejecutar sincronización manualmente'
        type: boolean
        default: false

jobs:
  sync_catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: pip install -r ingestion/requirements.txt

      - name: 💾 Restaurar cache de tokens MercadoLibre
        uses: actions/cache@v4
        id: meli-cache
        with:
          path: ingestion/auth/tokens/meli_tokens.json
          key: meli-tokens-${{ runner.os }}-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            meli-tokens-${{ runner.os }}-

      - name: 🔑 Restaurar tokens desde Secret (fallback)
        run: |
          mkdir -p ingestion/auth/tokens
          if [ ! -s ingestion/auth/tokens/meli_tokens.json ]; then
            if [ -n "${{ secrets.MELI_TOKENS }}" ]; then
              echo '${{ secrets.MELI_TOKENS }}' > ingestion/auth/tokens/meli_tokens.json
            elif [ -n "${{ secrets.MELI_TOKENS_JSON }}" ]; then
              echo '${{ secrets.MELI_TOKENS_JSON }}' > ingestion/auth/tokens/meli_tokens.json
            fi
          fi

      - name: 🚀 Ejecutar Sincronización a NeonDB
        env:
          APP_ID:           ${{ secrets.APP_ID }}
          CLIENT_SECRET:    ${{ secrets.CLIENT_SECRET }}
          MELI_CLIENT_ID:   ${{ secrets.APP_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          MELI_TOKENS_JSON: ${{ secrets.MELI_TOKENS_JSON }}
          MELI_TOKENS:      ${{ secrets.MELI_TOKENS }}
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          RESEND_API_KEY:   ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM:       ${{ secrets.EMAIL_FROM }}
          PYTHONPATH:       ${{ github.workspace }}/ingestion
        working-directory: ingestion
        run: python run_products_web_sync.py

      - name: 📋 Mostrar logs si falló
        if: failure()
        run: |
          echo "=== SINCRONIZACIÓN CATÁLOGO FALLÓ ==="
          cat ingestion/logs/etl.log 2>/dev/null || echo "No hay archivo de log"
