[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "ingestion/etl-env",
    "notebooks",
    "notebooks:00_EDA",
    "*.ipynb",
    ".git",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F841", "E402"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["ingestion"]
